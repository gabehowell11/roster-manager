[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rostermanager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6", "pydantic", "platformdirs"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit", "pyinstaller"]
data = ["pandas", "nflreadpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
