name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish a
# GitHub Release with RosterManagerSetup.exe attached. The README's download link
# points at releases/latest/download/RosterManagerSetup.exe, so it always gets the
# newest one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Tag must match pyproject version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject version $version"
          }

      - name: Tests
        run: python -m pytest

      - name: Build app folder
        run: python packaging/build.py

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Install, self-test, and uninstall
        shell: pwsh
        run: ./packaging/test_installer.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/RosterManagerSetup.exe `
            --title "Roster Manager ${{ github.ref_name }}" `
            --generate-notes
