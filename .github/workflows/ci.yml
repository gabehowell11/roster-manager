name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Lets Qt widgets be created in tests without a visible window.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

  build:
    # Builds the Windows app folder and checks the exe starts, after the checks pass.
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,data]"

      - name: Build with PyInstaller
        run: python packaging/build.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RosterManager\RosterManager.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "RosterManager.exe --self-test failed with exit code $($p.ExitCode)" }

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: RosterManager-windows
          path: dist/RosterManager/
          retention-days: 14
